name: News Bot
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: news-bot-publish
  cancel-in-progress: false
jobs:
  post-news:
    runs-on: ubuntu-latest
    # ФИКС: без явного лимита GitHub Actions по умолчанию разрешает job
    # выполняться до 6 часов. Если один запуск подвиснет на сетевых
    # ретраях (git push retries, HTTP retries к Telegram/GigaChat), он
    # будет держать concurrency-группу занятой аномально долго, и все
    # последующие запуски по cron (каждые 5 минут) будут просто
    # выстраиваться в очередь / вытеснять друг друга, не публикуя ничего
    # реально нового — со стороны это выглядит как "бот замолчал". 10
    # минут — с большим запасом покрывает нормальный сценарий (реальные
    # прогоны занимают 1-4 минуты, см. историю запусков).
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          GIGACHAT_AUTH_KEY: ${{ secrets.GIGACHAT_AUTH_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python post_news.py
