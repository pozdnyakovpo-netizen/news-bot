name: News Bot
on:
  schedule:
    # ФИКС: было */2 (раз в 2 минуты). GitHub Actions официально не
    # гарантирует точность расписаний чаще 5 минут — при нагрузке события
    # задерживаются и могут накапливаться в очереди, что повышает шанс
    # конфликтов при git push и, как следствие, риск дублей (см. переписку
    # про дубль поста с СУ-34). */5 — более безопасный интервал.
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: news-bot-publish
  cancel-in-progress: false
jobs:
  post-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GIGACHAT_AUTH_KEY: ${{ secrets.GIGACHAT_AUTH_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python post_news.py
