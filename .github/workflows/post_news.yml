name: News Bot

on:
  schedule:
    - cron: "*/2 * * * *"   # проверка каждые 2 минуты (сам бот решает, публиковать или нет)
  workflow_dispatch:         # позволяет запускать вручную кнопкой в Actions

permissions:
  contents: write            # обязательно — без этого бот не сможет сохранить файлы состояния

jobs:
  post-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser requests urllib3

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GIGACHAT_AUTH_KEY: ${{ secrets.GIGACHAT_AUTH_KEY }}
        run: python bot.py
